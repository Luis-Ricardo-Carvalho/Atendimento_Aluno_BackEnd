spring.application.name=ifsystem
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ifsystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# External room source: CSV export or file:/absolute/path.csv. Never commit credentials.
app.rooms.location=${ROOMS_LOCATION:https://docs.google.com/spreadsheets/d/1KKREZRFIJuv5r7Oj8v7Eak54i_xZWs8bt-trL9PEY6Y/export?format=csv&gid=1107580491}
app.rooms.name-column=${ROOMS_NAME_COLUMN:Sala / Local}
app.rooms.id-column=${ROOMS_ID_COLUMN:}
app.rooms.cache-ttl=${ROOMS_CACHE_TTL:PT5M}
app.rooms.zone=${ROOMS_ZONE:America/Sao_Paulo}


server.port=${PORT:8080}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Replace this calendar and the timetable together when the academic period changes.
app.rooms.calendar-location=${CALENDAR_LOCATION:classpath:calendar/academic-2026.csv}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_URL:https://ifsistem-auth.onrender.com}/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_URL:https://ifsistem-auth.onrender.com}
