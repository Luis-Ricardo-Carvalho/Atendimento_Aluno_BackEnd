# Blueprint opcional do Render: New + > Blueprint. Serviço Docker (NÃO Python).
services:
  - type: web
    name: atendimento-aluno-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "4"
      - key: APP_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_URL
        value: https://ifsistem-auth.onrender.com
